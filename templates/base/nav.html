{% load static %}

<header class="site-header">
    <nav class="navbar container" style="display: flex; align-items: center; justify-content: space-between; flex-wrap: nowrap; width: 100%; overflow-x: auto;">

        <div class="nav-auth-group" style="display: flex; align-items: center; gap: 0.4rem; flex-shrink: 0;">
            {% if request.user.is_authenticated %}
                <div class="nav-item" style="display: inline-block;">
                    <a href="{% url 'accounts:profile-details' %}" class="user-profile-trigger" style="text-decoration: none; display: flex; align-items: center; gap: 0.5rem; white-space: nowrap; padding: 0.4rem 0.8rem; background: rgba(255, 255, 255, 0.08); border-radius: 50px; border: 1px solid rgba(255, 255, 255, 0.1); transition: background 0.2s ease;">
                        <div class="user-avatar-circle" style="width: 28px; height: 28px; background: #c084fc; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #0f172a;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        </div>
                        <span class="nav-username" style="color: #e2e8f0; font-weight: 500; font-size: 0.9rem;">{{ request.user.username }}</span>
                    </a>
                </div>
            {% else %}
                <a href="{% url 'accounts:login' %}" class="nav-link login-link" style="white-space: nowrap; text-decoration: none; color: #cbd5e1; font-size: 0.9rem; font-weight: 500;">Log In</a>
                <span style="color: rgba(255, 255, 255, 0.3); font-weight: 300;">|</span>
                <a href="{% url 'accounts:register' %}" class="nav-link register-link" style="white-space: nowrap; text-decoration: none; color: #cbd5e1; font-size: 0.9rem; font-weight: 500;">Register</a>
            {% endif %}
        </div>

        <a href="{% url 'common:home' %}" class="nav-brand" style="white-space: nowrap; flex-shrink: 0; margin: 0 1rem;">
            ✈️ Journeylog
        </a>

        <ul class="nav-menu" style="display: flex; align-items: center; gap: 0.75rem; list-style: none; margin: 0; padding: 0; flex-wrap: nowrap; flex-shrink: 0;">
            <li><a href="{% url 'trips:list' %}" class="nav-link" style="white-space: nowrap;">Trips</a></li>
            <li><a href="{% url 'destinations:list' %}" class="nav-link" style="white-space: nowrap;">Destinations</a></li>
            <li><a href="{% url 'activities:list' %}" class="nav-link" style="white-space: nowrap;">Activities</a></li>
            <li><a href="{% url 'travel_notes:list' %}" class="nav-link" style="white-space: nowrap;">Travel Notes</a></li>
            <li><a href="{% url 'packing_items:list' %}" class="nav-link" style="white-space: nowrap;">Packing Lists</a></li>
            <li><a href="{% url 'destinations:add' %}" class="btn" style="white-space: nowrap;">+ Add Destination</a></li>
            <li><a href="{% url 'trips:add' %}" class="btn" style="white-space: nowrap;">+ Add Trip</a></li>
        </ul>

    </nav>
</header>
