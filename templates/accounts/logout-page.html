{% extends 'base/base.html' %}

{% block title %}
    Log Out | JourneyLog
{% endblock %}

{% block content %}

<section class="form-page auth-form-page" style="padding: 4rem 1rem;">
    <div class="form-container auth-form-container" style="max-width: 500px; margin: 0 auto; background: rgba(15, 23, 42, 0.85); padding: 2.5rem; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.15); backdrop-filter: blur(16px); box-shadow: 0 20px 40px rgba(0,0,0,0.4); text-align: center;">
        
        <div class="form-header auth-form-header" style="margin-bottom: 2rem;">
            <span class="section-label" style="color: #c084fc; font-weight: 600; font-size: 0.85rem; letter-spacing: 0.05em; text-transform: uppercase;">
                 SAFE SESSION
            </span>
            <h1 style="color: #ffffff; font-size: 2.2rem; font-weight: 800; margin: 0.5rem 0;">Ready to Leave?</h1>
            <p style="color: #cbd5e1; font-size: 1rem;">
                Are you sure you want to log out of your JourneyLog account?
            </p>
        </div>

        <form method="post" class="styled-form auth-form">
            {% csrf_token %}
            
            <div class="form-actions auth-form-actions" style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1; text-align: center; padding: 0.75rem; border-radius: 12px; font-weight: 600; background-color: #ef4444; border-color: #ef4444; cursor: pointer;">
                    Log Out
                </button>

                <a href="{% url 'accounts:profile-details' %}" class="btn btn-outline" style="flex: 1; text-align: center; padding: 0.75rem; border-radius: 12px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; justify-content: center;">
                    Cancel
                </a>
            </div>

        </form>

    </div>
</section>

{% endblock %}
