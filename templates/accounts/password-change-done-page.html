{% extends 'base/base.html' %}

{% block title %}
    Password Changed | JourneyLog
{% endblock %}

{% block content %}

<section class="form-page auth-form-page" style="padding: 4rem 1rem;">
    <div class="form-container auth-form-container" style="max-width: 500px; margin: 0 auto; background: rgba(15, 23, 42, 0.85); padding: 2.5rem; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.15); backdrop-filter: blur(16px); box-shadow: 0 20px 40px rgba(0,0,0,0.4); text-align: center;">
        
        <div style="width: 70px; height: 70px; background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.4); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem auto; color: #4ade80;">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>

        <div class="form-header auth-form-header" style="margin-bottom: 2rem;">
            <span class="section-label" style="color: #4ade80; font-weight: 600; font-size: 0.85rem; letter-spacing: 0.05em; text-transform: uppercase;">
                 SUCCESSFUL UPDATE
            </span>
            <h1 style="color: #ffffff; font-size: 2.2rem; font-weight: 800; margin: 0.5rem 0;">Password Changed!</h1>
            <p style="color: #cbd5e1; font-size: 1rem; line-height: 1.5;">
                Your password has been changed successfully. You can now use your new password for future log ins.
            </p>
        </div>

        <div class="form-actions auth-form-actions" style="margin-top: 2rem;">
            <a href="{% url 'accounts:profile-details' %}" class="btn btn-primary" style="display: block; width: 100%; text-align: center; padding: 0.75rem; border-radius: 12px; font-weight: 600; text-decoration: none; box-sizing: border-box;">
                Back to Profile
            </a>
        </div>

    </div>
</section>

{% endblock %}
