{% extends 'base/base.html' %}

{% block title %}
    Email Sent | JourneyLog
{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 70vh; padding: 2rem 1rem;">
    <div class="card" style="width: 100%; max-width: 480px; text-align: center; background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px; padding: 3rem 2rem; backdrop-filter: blur(16px); box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);">
        
        <div style="font-size: 3rem; margin-bottom: 1rem;">✉️</div>
        <h1 style="font-size: 1.8rem; font-weight: 800; color: #ffffff; margin-bottom: 1rem;">Check Your Email</h1>
        <p style="color: var(--text-muted, #cbd5e1); font-size: 0.95rem; line-height: 1.6; margin-bottom: 2rem;">
            We’ve emailed you instructions for setting your password, if an account exists with the email you entered. You should receive them shortly.
        </p>
        
        <a href="{% url 'accounts:login' %}" class="btn" style="display: inline-block; width: 100%; padding: 0.8rem; border-radius: 12px; font-weight: 600; text-decoration: none; box-sizing: border-box;">
            Back to Login
        </a>

    </div>
</div>
{% endblock %}
