{% extends 'base/base.html' %}

{% block title %}
    Add Trip | Journeylog
{% endblock %}

{% block content %}

<section class="form-page trip-form-page">
    <div class="form-container trip-form-container">
        <div class="form-header trip-form-header">

            <span class="section-label">
                PLAN NEW JOURNEY
            </span>

            <h1>Add a New Trip</h1>

        </div>

        <form method="post" class="styled-form trip-form">
            {% csrf_token %}

            {{ form.as_p }}

            <div class="form-actions trip-form-actions" style="margin-top: 2rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1; text-align: center;">
                    Create Trip
                </button>

                <a href="{% url 'trips:list' %}" class="btn btn-outline" style="flex: 1; text-align: center;">
                    Cancel
                </a>
            </div>

        </form>

    </div>
</section>

{% endblock %}
