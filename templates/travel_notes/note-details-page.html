{% extends 'shared/base.html' %}

{% block title %}
{{ note.title }} | Journeylog
{% endblock %}

{% block content %}

<section class="details-page note-details-page" style="max-width: 750px; margin: 3rem auto; padding: 0 1rem;">
    <div class="card" style="padding: 2.5rem; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);">

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
            <span class="section-label" style="background: rgba(192, 132, 252, 0.15); color: #e9d5ff; border: 1px solid rgba(192, 132, 252, 0.3); padding: 0.3rem 0.8rem; border-radius: 20px; font-weight: 600; font-size: 0.85rem;">
                📝 TRAVEL NOTE
            </span>

            {% if note.trip %}
                <span style="color: var(--text-muted, #cbd5e1); font-size: 0.9rem;">
                    ✈️ Trip Title: <strong style="color: #ffffff;">{{ note.trip.title }}</strong>
                </span>
            {% endif %}
        </div>

        <h1 style="font-size: clamp(1.8rem, 3vw, 2.4rem); font-weight: 800; color: #ffffff; margin: 0 0 1.5rem 0; line-height: 1.2;">
            {{ note.title }}
        </h1>

        <hr style="border: none; border-top: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 1.5rem;">

        <div class="note-content" style="color: var(--text-muted, #cbd5e1); font-size: 1.05rem; line-height: 1.8; margin-bottom: 2.5rem;">
            {{ note.content }}
        </div>

        <div style="display: flex; gap: 0.75rem; align-items: center; justify-content: center; flex-wrap: wrap;">
            <a href="{% url 'travel_notes:edit' note.pk %}" class="btn btn-primary" style="flex: 1; padding: 0.6rem 1rem; font-size: 1rem; border-radius: 12px; text-align: center; display: inline-flex; justify-content: center; align-items: center;">
                Edit Note
            </a>

            <a href="{% url 'travel_notes:delete' note.pk %}" class="btn" style="flex: 1; padding: 0.6rem 1rem; font-size: 1rem; border-radius: 12px; text-align: center; background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4); display: inline-flex; justify-content: center; align-items: center;">
                Delete Note
            </a>

            <a href="{% url 'trips:details' note.trip.pk %}" class="btn btn-outline" style="flex: 1; padding: 0.6rem 1rem; font-size: 0.95rem; border-radius: 12px; text-align: center; display: inline-flex; justify-content: center; align-items: center;">
                ← Back to Trip Details
            </a>
        </div>

    </div>
</section>

{% endblock %}
